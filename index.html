<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Lawn Care | Professional Yard Maintenance</title>
    <meta name="description" content="Reliable residential lawn mowing, weeding, and yard maintenance services for local homeowners.">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Apex Lawn Care">
    <meta property="og:description" content="Professional residential lawn mowing, weeding, and yard maintenance services.">
    <meta property="og:type" content="website">

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN with custom theme config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#166534',
                            dark: '#14532D',
                            light: '#F0FDF4'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Note: Tailwind Play CDN is used here for simplicity and can be swapped for a compiled build later. -->

    <!-- Lucide Icons pinned version -->
    <script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script>

    <!-- Custom CSS for animations and styling rules -->
    <style>
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }
        .fade-up.active {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-reduced-motion: reduce) {
            .fade-up {
                opacity: 1;
                transform: none;
                transition: none;
            }
        }
    </style>
</head>
<body class="bg-[#FAF9F6] text-[#111827] font-sans antialiased selection:bg-brand selection:text-white">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-[#E5E7EB]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="font-heading font-bold text-xl text-[#111827] flex items-center gap-2">
                <i data-lucide="shrub" class="w-6 h-6 text-brand"></i>
                Apex Lawn Care
            </a>
            
            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex items-center gap-8 font-medium text-sm text-[#4B5563]">
                <a href="#services" class="hover:text-brand transition-colors">Services</a>
                <a href="#about" class="hover:text-brand transition-colors">About</a>
                <a href="#contact" class="hover:text-brand transition-colors">Contact</a>
            </nav>

            <!-- Desktop CTA -->
            <div class="hidden md:block">
                <a href="https://wa.me/15551234567" target="_blank" rel="noopener noreferrer" class="bg-brand hover:bg-brand-dark text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-colors shadow-sm inline-flex items-center gap-2">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                    Get a Quote
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button id="menu-btn" aria-label="Open mobile menu" class="md:hidden p-2 text-[#4B5563] hover:text-[#111827] focus:outline-none focus:ring-2 focus:ring-brand rounded-lg">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Mobile Menu Panel (Hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-[#E5E7EB] px-4 pt-2 pb-6 space-y-3">
            <a href="#services" class="block px-3 py-2 rounded-lg text-base font-medium text-[#4B5563] hover:bg-brand-light hover:text-brand">Services</a>
            <a href="#about" class="block px-3 py-2 rounded-lg text-base font-medium text-[#4B5563] hover:bg-brand-light hover:text-brand">About</a>
            <a href="#contact" class="block px-3 py-2 rounded-lg text-base font-medium text-[#4B5563] hover:bg-brand-light hover:text-brand">Contact</a>
            <div class="pt-2">
                <a href="https://wa.me/15551234567" target="_blank" rel="noopener noreferrer" class="w-full bg-brand text-white font-medium px-5 py-3 rounded-lg text-center text-sm inline-flex items-center justify-center gap-2 shadow-sm">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                    Get a Quote
                </a>
            </div>
        </div>
    </header>

    <!-- JavaScript to initialize icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
